[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "foreman-plane"
version = "0.2.0"
description = "A task governance plane for a personal toolchain: dispatch, dependency gates, objective acceptance, an append-only ledger — outside your agent harness, zero dependencies, one process, one file."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Foreman Plane contributors" }]
keywords = ["agents", "mcp", "orchestration", "task-governance", "audit", "personal-tools", "lightweight", "solo-dev"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.scripts]
# The `foreman` command is deliberately NOT provided: the name is taken by
# other projects (an AI orchestration engine on npm, an infrastructure
# manager on GitHub) and a shared binary name is a real conflict on PATH.
# `gongtou` — 工头 — is the short alias for people who prefer it.
foreman-plane = "foreman_plane.cli:main"
gongtou = "foreman_plane.cli:main"

[project.urls]
Homepage = "https://github.com/Anthony-Vivalink/foreman-plane"
Source = "https://github.com/Anthony-Vivalink/foreman-plane"
Issues = "https://github.com/Anthony-Vivalink/foreman-plane/issues"
Changelog = "https://github.com/Anthony-Vivalink/foreman-plane/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
