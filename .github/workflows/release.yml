name: Release

# One workflow, two destinations:
#   1. a GitHub Release with the wheel and the sdist attached
#   2. (optional) a PyPI upload through Trusted Publishing (OIDC, no token)
#
# The GitHub Release needs no secret from anyone: the workflow gets
# `GITHUB_TOKEN` for free, and that is enough for `contents: write`.
#
# The PyPI job is gated on the repository variable `PYPI_PUBLISH` being set
# to "true".  Turn it on after adding the trusted publisher on pypi.org:
#   project foreman-plane -> Publishing -> add a GitHub Actions publisher
#   owner: Anthony-Vivalink, repository: foreman-plane,
#   workflow name: release.yml
# Then: Settings -> Secrets and variables -> Actions -> Variables ->
#   PYPI_PUBLISH = true
#
# Manual run: Actions -> Release -> Run workflow -> pick a tag.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "tag to release (e.g. v0.2.0)"
        required: true
        default: "v0.2.0"

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  PYTHON_VERSION: "3.10"

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run the test suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: List artefacts
        run: ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    name: github release
    needs: build
    runs-on: ubuntu-latest
    steps:
      # checkout is required: `gh` resolves the repository from the git
      # context, and without it every `gh release` call exits 1.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          ls -l dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — uploading assets only"
            gh release upload "$TAG" dist/* --clobber
          elif [ -f docs/RELEASE_NOTES.md ]; then
            gh release create "$TAG" dist/* \
              --title "foreman-plane $TAG" \
              --notes-file docs/RELEASE_NOTES.md
          else
            gh release create "$TAG" dist/* \
              --title "foreman-plane $TAG" \
              --generate-notes
          fi

  pypi:
    name: publish to pypi
    needs: build
    if: ${{ vars.PYPI_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # No `environment:` on purpose — the PyPI trusted publisher is
      # registered without an environment name, and a mismatch between the
      # two makes the OIDC exchange fail with a puzzling error.
      - uses: pypa/gh-action-pypi-publish@release/v1
